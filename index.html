<title>AS&amp;S Scheduler Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed navy sidebar + scrolling workspace on desktop; sidebar becomes a top bar with a menu on phones. Same family as the student app. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --sunk:#f6f8fa; --ink:#122131; --muted:#5b6b7c; --line:#d8dfe6;
  --side:#0f1d2b; --side-ink:#c9d5e1; --side-hi:#ffffff; --side-act:#1d5ea8;
  --accent:#1d5ea8; --accent-ink:#ffffff; --accent-soft:#e3edf8;
  --ok:#1f7a4a; --ok-soft:#e2f2e9; --warn:#a56200; --warn-soft:#fbefd9; --bad:#b3261e; --bad-soft:#fbe5e3;
  --dual:#1d5ea8; --solo:#6b4fbb; --tour:#0f8a7e; --ground:#a56200; --mx:#7a8794; --job:#b8326b;
  --display:"Saira Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:var(--body); /* numbers use the regular font with evenly spaced digits */ --code:"IBM Plex Mono",ui-monospace,Menlo,monospace; /* METAR only */
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1219; --surface:#16212c; --sunk:#111a23; --ink:#e6edf3; --muted:#93a3b3; --line:#283645;
  --side:#070d13; --side-ink:#9fb0c1; --side-hi:#ffffff; --side-act:#2a6fbf;
  --accent:#5fa2ec; --accent-ink:#06121f; --accent-soft:#1a3049;
  --ok:#5cc58b; --ok-soft:#173326; --warn:#f0b357; --warn-soft:#3a2a10; --bad:#f2847b; --bad-soft:#3d1a18;
  --dual:#5fa2ec; --solo:#a58cf0; --tour:#3fc2b3; --ground:#f0b357; --mx:#8b99a7; --job:#f07aa8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1219; --surface:#16212c; --sunk:#111a23; --ink:#e6edf3; --muted:#93a3b3; --line:#283645;
  --side:#070d13; --side-ink:#9fb0c1; --side-hi:#ffffff; --side-act:#2a6fbf;
  --accent:#5fa2ec; --accent-ink:#06121f; --accent-soft:#1a3049;
  --ok:#5cc58b; --ok-soft:#173326; --warn:#f0b357; --warn-soft:#3a2a10; --bad:#f2847b; --bad-soft:#3d1a18;
  --dual:#5fa2ec; --solo:#a58cf0; --tour:#3fc2b3; --ground:#f0b357; --mx:#8b99a7; --job:#f07aa8; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh;background:linear-gradient(to right,var(--side) 232px,transparent 232px)}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;
  padding:20px 12px 16px max(12px,env(safe-area-inset-left,0px))}
.brand{font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--side-hi);font-size:16px;padding:0 10px 4px}
.brand span{color:#6fb0f0}
.brand-sub{font-size:12px;padding:0 10px 18px;color:var(--side-ink)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;padding:14px 10px 6px;color:#6f8396}
.nav button{display:flex;align-items:center;gap:10px;text-align:left;padding:8px 10px;border-radius:8px;color:var(--side-ink);font-weight:500}
.nav button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav button:hover{background:rgba(255,255,255,.06);color:var(--side-hi)}
.nav button[aria-current="page"]{background:var(--side-act);color:#fff}
.nav .badge{margin-left:auto;background:var(--bad);color:#fff;font-size:11px;font-weight:600;border-radius:99px;padding:0 7px;line-height:18px}
.rolebox{display:flex;flex-direction:column;gap:6px;margin:0 4px 6px;padding:10px;border-radius:10px;background:rgba(255,255,255,.06);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#f3c37a;font-weight:600}
.demo-role{font:inherit;font-size:13px;letter-spacing:0;text-transform:none;font-weight:500;color:#fff;background:#1d2f42;border:1px solid #3a5068;border-radius:8px;padding:6px 8px;width:100%}
.rb-reset{align-self:flex-start;font-size:12px;letter-spacing:0;text-transform:none;color:#9cc7f2;font-weight:600;padding:0}
.gsteps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:8px;counter-reset:g}
.gsteps li{counter-increment:g}
.gsteps .gk::before{content:counter(g);color:var(--muted)}
.gsteps li.done .gk::before{content:"";}
.gsteps li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.gsteps li b{display:block;font-weight:600}
.gsteps li span{font-size:12.5px;color:var(--muted)}
.gsteps .gk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.gsteps li.done{opacity:.65}
.gsteps li.done .gk{background:var(--ok);border-color:var(--ok)}
@media (max-width:560px){.gsteps li{grid-template-columns:24px minmax(0,1fr)}.gsteps li .btn{grid-column:2}}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.item{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;min-height:72px}
.item:hover{border-color:var(--accent)}.item.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.item .q{position:absolute;top:8px;right:8px;min-width:22px;height:22px;border-radius:11px;background:var(--accent);color:var(--accent-ink);font:600 12px var(--mono);display:grid;place-items:center;padding:0 6px}
.sellbox{display:flex;flex-direction:column;gap:12px}
.cartl{display:flex;flex-direction:column;gap:6px}
.cl{display:grid;grid-template-columns:1fr auto 80px;gap:10px;align-items:center}
.cl>span:last-child{text-align:right}
.cl .qty{display:flex;align-items:center;gap:6px}
.cl.sub{color:var(--muted);font-size:13px}.cl.sub:first-of-type{border-top:1px solid var(--line);padding-top:8px}
.cl.tot{font-weight:600;font-size:17px}
.itemchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.itemsum{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin-top:8px;font-size:13.5px;padding:10px 12px;background:var(--sunk);border-radius:10px}
.itemsum>span:nth-child(even),.itemsum>b:nth-child(even){text-align:right}
.lnk{background:none;border:0;padding:0;margin-left:6px;color:var(--accent);font:inherit;font-size:12px;cursor:pointer;text-decoration:underline}
.itemed input:not([type=checkbox]),.itemed select{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
.itemed td:first-child input{width:100%;min-width:140px}
.itemed tr.off td{opacity:.55}
.taxrow{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-top:12px}
td.rates{white-space:nowrap}
td.rates .rate-in{width:52px!important;min-width:0}
td.rates .rate-l{font-size:12px;color:var(--muted);margin-left:8px}
td.rates .rate-l:first-child{margin-left:0}
.hgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:700px){.hgrid{grid-template-columns:1fr 1fr}}
.hgrid .field select,.field input#hNote{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
.hsum{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding:10px 12px;background:var(--sunk);border-radius:10px}
.hsum b{font-size:20px}
.rdh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.rdout{font-size:12.5px;font-weight:400;color:var(--muted)} .rdout b{color:var(--ink);font-weight:400}
.rddiff{font-size:12px;font-weight:400;color:var(--muted);min-height:16px}
.dw-hact{display:flex;gap:6px;align-items:flex-start;flex-shrink:0}
.rolesw{display:flex;flex-wrap:wrap;gap:6px}
.rsw{display:inline-flex;align-items:center;gap:6px;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer;color:var(--muted)}
.rsw.on{border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
.rsw input{margin:0;accent-color:var(--accent)}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg2 button{font:inherit;font-size:13.5px;font-weight:600;padding:7px 14px;border:0;background:none;color:var(--muted);cursor:pointer}
.seg2 button+button{border-left:1px solid var(--line)}
.seg2 button.on{background:var(--accent-soft);color:var(--accent)}
.sch-nav{display:inline-flex;gap:6px}
.sch-sub{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.sch-week{min-width:980px;table-layout:fixed}
.sch-week th{text-align:left}
.sch-week th:first-child,.sch-week td.sch-rl{width:130px}
.sch-week td{vertical-align:top;padding:6px 5px}
.sch-week .tday{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.sch-week td.past .sch-chip{opacity:.6}
.sch-dh{font:inherit;font-size:12px;color:var(--muted);background:none;border:0;padding:2px 4px;border-radius:6px;cursor:pointer;text-transform:uppercase;letter-spacing:.06em}
.sch-dh b{font:600 15px var(--body);color:var(--ink);letter-spacing:0}
.sch-dh:hover{background:var(--sunk)}
.sch-rl b{display:block;font-size:13.5px} .sch-rl span{font-size:12px;color:var(--muted)}
.sch-chip{display:block;width:100%;text-align:left;font:inherit;font-size:12px;line-height:1.3;border:1px solid var(--line);border-left:3px solid var(--mx);background:var(--surface);color:var(--ink);border-radius:6px;padding:4px 6px;margin-bottom:4px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sch-chip i{display:block;font-style:normal;color:var(--muted);font-size:11px}
.sch-chip .mono{font-size:11px;color:var(--muted)}
.sch-chip.dual{border-left-color:var(--dual)} .sch-chip.solo{border-left-color:var(--solo)} .sch-chip.tour{border-left-color:var(--tour)} .sch-chip.ground{border-left-color:var(--ground)} .sch-chip.job{border-left-color:var(--job)} .sch-chip.mx{border-left-color:var(--mx)}
.sch-chip.done{opacity:.6}
.sch-chip:hover{border-color:var(--accent)}
.sch-open{font-size:12px;color:var(--muted)}
.sch-mh,.sch-mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.sch-mh span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:0 6px 6px;font-weight:600}
.sch-mg{border-top:1px solid var(--line);border-left:1px solid var(--line)}
.sch-cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:118px;padding:4px 5px 6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.sch-cell.out{background:var(--sunk)} .sch-cell.out .sch-dn{color:var(--muted)}
.sch-cell.tday{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.sch-cell.tday .sch-dn{background:var(--accent);color:var(--accent-ink)}
.sch-cell.past .sch-chip{opacity:.55}
.sch-dn{align-self:flex-start;font:600 13px var(--body);color:var(--ink);background:none;border:0;border-radius:999px;min-width:26px;height:26px;padding:0 6px;cursor:pointer}
.sch-dn:hover{background:var(--sunk)}
.sch-cl .sch-chip{margin-bottom:3px;padding:2px 5px;font-size:11.5px}
.sch-more{font:inherit;font-size:11.5px;color:var(--accent);background:none;border:0;padding:0 2px;cursor:pointer;text-align:left}
.sch-cnt{display:none;font-size:11px;color:var(--muted)}
@media (max-width:700px){.sch-cell{min-height:64px}.sch-cl{display:none}.sch-cnt{display:block}.sch-mh span{padding:0 2px 6px;text-align:center}.sch-dn{align-self:center}}
.drawer.wide{width:min(760px,100%)}
.dw-grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
.afc{display:flex;flex-direction:column;gap:6px}
.afc-hd{order:-1;display:grid;grid-template-columns:minmax(0,1.6fr) 80px 80px 140px 1fr 34px;gap:6px;font-size:11px;color:var(--muted)}
.afc-r{display:grid;grid-template-columns:minmax(0,1.6fr) 80px 80px 140px 1fr 34px;gap:6px;align-items:center}
.afc-r input{font:inherit;font-size:13.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 8px;min-width:0;width:100%}
.afc-left{font-size:12px;color:var(--muted);white-space:nowrap} .afc-left.warn{color:var(--warn);font-weight:600} .afc-left.bad{color:var(--bad);font-weight:600}
@media (max-width:640px){.afc-hd{display:none}.afc-r{grid-template-columns:1fr 1fr;padding:8px;border:1px solid var(--line);border-radius:10px}.afc-r input[data-k="n"]{grid-column:1/-1}.dw-grid3{grid-template-columns:1fr 1fr}}
.lm-eff{font-size:13px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);color:var(--ink)}
.atnbar{margin-bottom:16px}
.attn-h{flex-wrap:wrap;gap:12px}
.attn-c{font-size:12.5px;color:var(--muted);margin-right:auto}
.attn-c .ac-bad{color:var(--bad);font-weight:600} .attn-c .ac-warn{color:var(--warn);font-weight:600}
.atr{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.atr-dot{width:9px;height:9px;border-radius:50%;background:var(--accent)} .atr.bad .atr-dot{background:var(--bad)} .atr.warn .atr-dot{background:var(--warn)}
.atr-t{min-width:0;display:flex;gap:10px;align-items:baseline}
.atr-t b{font-size:14px;white-space:nowrap}
.atr-t span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.atr-a{display:flex;gap:6px}
.atnbar.atn-clear{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding:10px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-size:14px}
.attn-ok{width:22px;height:22px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-weight:700;font-size:12px}
@media (max-width:700px){.atr{grid-template-columns:10px minmax(0,1fr);row-gap:6px}.atr-t{flex-direction:column;gap:1px}.atr-t b{white-space:normal}.atr-t span{display:none}.atr-a{grid-column:2}}
.cxbox{border:1px solid color-mix(in srgb,var(--bad) 40%,var(--line));background:color-mix(in srgb,var(--bad) 5%,var(--surface));border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;margin-top:6px}
.btn.danger,.btn.danger:hover{background:#b3261e!important;border-color:#b3261e!important;color:#fff!important}
.btn.danger-ghost{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
tr.cx td{color:var(--muted)} tr.cx td:nth-child(3){text-decoration:line-through}
.blk.drag{cursor:grab;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.blk.lifted{transform:scale(1.06);z-index:6;box-shadow:0 8px 22px rgba(0,0,0,.3);transition:transform .12s}
.toast.undo{display:flex;align-items:center;gap:14px}
.toast.undo button{font:inherit;font-weight:700;color:#9cc7f2;background:none;border:0;padding:4px 2px;cursor:pointer;white-space:nowrap}
.blk.dragging{cursor:grabbing;z-index:5;box-shadow:0 6px 18px rgba(0,0,0,.25);filter:brightness(1.1)}
.blk .rz{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize;z-index:1}
.blk .rz.l{left:0;border-left:3px solid rgba(255,255,255,0)} .blk .rz.r{right:0;border-right:3px solid rgba(255,255,255,0)}
.blk.drag:hover .rz.l{border-left-color:rgba(255,255,255,.7)} .blk.drag:hover .rz.r{border-right-color:rgba(255,255,255,.7)}
body.tl-dragging{user-select:none;-webkit-user-select:none}
.tl-lane.drop{background-color:color-mix(in srgb,var(--accent) 14%,transparent)}
.blk{cursor:pointer} .blk:hover{filter:brightness(1.08)}
.dw-scrim{position:fixed;inset:0;background:rgba(8,16,24,.4);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--surface);z-index:31;box-shadow:-8px 0 30px rgba(0,0,0,.18);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dw-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.dw-t{font-family:var(--display);font-weight:600;font-size:22px;margin:8px 0 2px}
.dw-b{padding:16px 20px 28px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.dw-b p{margin:0}
.dw-s{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 0 0}
.dw-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dw-b .field input,.dw-b .field select,.dw-b .field textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.chk input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.fuelp{display:flex;gap:6px;flex-wrap:wrap}
.wbb{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wbb.ok{border-color:var(--ok)} .wbb.bad{border-color:var(--bad);background:var(--bad-soft)}
.err-b{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:9px 12px;font-size:13.5px;font-weight:500}
.side-foot{margin-top:auto;padding:12px 10px 0;font-size:12px;border-top:1px solid rgba(255,255,255,.08)}
.side-foot b{color:var(--side-hi);display:block;font-weight:600}

.work-col{min-width:0}
.work{min-width:0;padding-block:20px 40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.topbar{display:none}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-h h1{font-family:var(--display);font-weight:600;font-size:30px;line-height:1.05;margin:0;text-wrap:balance}
.page-h .sub{color:var(--muted);margin:4px 0 0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:9px;padding:8px 14px;font-weight:600;min-height:38px;border:1px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{min-height:30px;padding:4px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.sample{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);padding:3px 8px;border-radius:6px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 10px;flex-wrap:wrap}
.panel-h h2{font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
.panel-b{padding:0 16px 16px}

  if((p[axis]-v)*(q[axis]-v)<=0)h.push(p[o]+(v-p[axis])*(q[o]-p[o])/(q[axis]-p[axis]))}

  if(kind==="rts"){saveBk(b,{st:"done"});BK=null;render();renderBk();toast(b.ac+" returned to service.");return}

function paySum(name){
  const p=PEOPLE.find(x=>x.name===name)||{flight:0,ground:0}, ls=PAY.filter(l=>l.who===name&&inP(l));
  let fl=0,gr=0,pay=0,wv=0;
  ls.forEach(l=>{if(l.waived){wv+=l.fl+l.gr;return}fl+=l.fl;gr+=l.gr;pay+=l.fl*p.flight+l.gr*p.ground});
  return {fl,gr,pay,wv,n:ls.length};
}

  R44:[["Engine · O-540-F1B5",2200],["Main rotor blades",2200],["Tail rotor blades",2200],["Main gearbox",2200],["Hydraulic servos",2200],["Clutch actuator",2200]]};
const isoOf=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const isoAnnual=a=>a.annualIso||isoOf(new Date(a.annual));
const endOfMonthPlus=(iso,months)=>{const d=new Date(iso+"T00:00:00");return isoOf(new Date(d.getFullYear(),d.getMonth()+months+1,0))}; // calendar-month inspections run to the end of the month
const modelKey=a=>(FLEET[a.tail]||{}).model||(/R44/.test(a.model)?"R44":"R22");
AIRCRAFT.forEach(a=>{if(a.oilDue==null)a.oilDue=+(a.tach+22.4).toFixed(1);(AC_MX[a.tail].comp||[]).forEach(c=>{if(c[3]==null)c[3]=2200})});
function acStatus(a){const rem=a.next100-a.tach,M=AC_MX[a.tail]||{insp:[]},near=[isoAnnual(a)].concat(M.insp.map(x=>x[1])).some(iso=>daysTo(iso)<=30);
  return rem<=0||daysTo(isoAnnual(a))<0?"bad":rem<10||near?"warn":"ok"}
function saveAcRecord(a){const rec=D.get("acRecords",{}),f=FLEET[a.tail];
  rec[a.tail]={tail:a.tail,model:a.model,serial:a.serial||"",rate:a.rate,bill:a.bill||"Hobbs",hobbs:a.hobbs,tach:a.tach,next100:a.next100,annualIso:isoAnnual(a),oilDue:a.oilDue,note:a.note||"",
    fleet:f,mx:AC_MX[a.tail]};D.set("acRecords",rec);
  const at=D.get("acTimes",{});at[a.tail]={hobbs:a.hobbs,tach:a.tach};D.set("acTimes",at)}
function loadAcRecords(){const rec=D.get("acRecords",{});Object.values(rec).forEach(r=>{let a=AIRCRAFT.find(x=>x.tail===r.tail);
  if(!a){a={tail:r.tail};AIRCRAFT.push(a)}
  Object.assign(a,{model:r.model,serial:r.serial,rate:r.rate,bill:r.bill,hobbs:r.hobbs,tach:r.tach,next100:r.next100,annualIso:r.annualIso,annual:fmtD(r.annualIso),oilDue:r.oilDue,note:r.note});
  FLEET[r.tail]=r.fleet;AC_MX[r.tail]=r.mx});
  AIRCRAFT.forEach(a=>{const c=(AC_MX[a.tail]||{comp:[]}).comp;a.ohRem=c.length?Math.min(...c.map(x=>x[1])):a.ohRem;a.status=acStatus(a)==="ok"?"ok":"warn"})}

function saveAF(){const f=AF,num=k=>parseFloat(f[k]),bad=m=>{f.err=m;renderAF();const e=$("afErr");if(e)e.scrollIntoView({block:"nearest"})};
  const tail=f.mode==="add"?f.tail.trim().toUpperCase():f.tail;
  if(f.mode==="add"){if(!/^N[1-9][0-9A-Z]{0,4}$/.test(tail))return bad("Enter a U.S. tail number, like N123AB.");if(AIRCRAFT.some(a=>a.tail===tail))return bad(tail+" is already in the fleet.")}
  for(const [k,l] of [["rate","rate"],["hobbs","Hobbs"],["tach","tach"],["bew","empty weight"],["arm","longitudinal CG"],["lat","lateral CG"],["next100","100-hour"],["oil","oil change"]])if(isNaN(num(k)))return bad("Enter the "+l+".");
  if(num("bew")<=0||num("bew")>=MODELS[f.key].maxGross)return bad("The empty weight doesn't look right for an "+MODELS[f.key].name+".");
  for(const [k,l] of [["annual","annual"],["elt","ELT inspection"],["eltBat","ELT battery"],["xpdr","transponder check"]])if(!f[k])return bad("Pick the "+l+" due date.");
  for(const c of f.comp){if(!c.n.trim())return bad("Every component needs a name.");if(isNaN(parseFloat(c.tso))||isNaN(parseFloat(c.lim)))return bad("Enter hours since new/overhaul and the hour limit for "+c.n+".");if(!c.cal)return bad("Pick the calendar limit for "+c.n+".")}
  let a=AIRCRAFT.find(x=>x.tail===tail);const was=a?{hobbs:a.hobbs,tach:a.tach}:null;
  if(!a){a={tail,note:""};AIRCRAFT.push(a)}
  Object.assign(a,{model:MODELS[f.key].name,serial:f.serial.trim(),rate:num("rate"),bill:f.bill,hobbs:num("hobbs"),tach:num("tach"),next100:num("next100"),annualIso:f.annual,annual:fmtD(f.annual),oilDue:num("oil")});
  FLEET[tail]={model:f.key,bew:num("bew"),arm:num("arm"),lat:num("lat")};
  AC_MX[tail]={insp:[["ELT (12-mo)",f.elt],["ELT battery",f.eltBat],["Transponder",f.xpdr]],comp:f.comp.map(c=>[c.n.trim(),+(parseFloat(c.lim)-parseFloat(c.tso)).toFixed(1),c.cal,parseFloat(c.lim)])};
  a.ohRem=Math.min(...AC_MX[tail].comp.map(x=>x[1]).concat([99999]));a.status=acStatus(a)==="ok"?"ok":"warn";
  saveAcRecord(a);D.push("mxLog",{tail,at:new Date().toISOString(),by:ME,type:f.mode==="add"?"Aircraft added":"Record edited",note:was&&(was.hobbs!==a.hobbs||was.tach!==a.tach)?`Times corrected from ${was.hobbs}/${was.tach}`:""});
  const added=f.mode==="add";AF=null;renderAF();selAc=tail;render();
  toast(added?`${tail} added. It's on the timeline and can be booked and dispatched.`:`${tail} saved. The change is logged.`)}

/* log maintenance */
const LM_TYPES=["100-hour inspection","Annual inspection","Oil change","ELT inspection","ELT battery replaced","Transponder check","Component replaced or overhauled","Other repair or work"];
let LM=null;
function renderLM(){const el=$("drawer"),m=LM;if(!m){el.innerHTML="";return}const a=AIRCRAFT.find(x=>x.tail===m.tail),M=AC_MX[m.tail];
  const effect={"100-hour inspection":`Next 100-hour moves to tach ${((parseFloat(m.tachAt)||a.tach)+100).toFixed(1)}.`,"Annual inspection":`Next annual due ${fmtD(endOfMonthPlus(m.date||isoOf(today),12))}.`,"Oil change":`Next oil change at tach ${((parseFloat(m.tachAt)||a.tach)+50).toFixed(1)}.`,
    "ELT inspection":`Next ELT inspection due ${fmtD(endOfMonthPlus(m.date||isoOf(today),12))}.`,"ELT battery replaced":"Enter the new battery's expiration date.","Transponder check":`Next transponder check due ${fmtD(endOfMonthPlus(m.date||isoOf(today),24))}.`,
    "Component replaced or overhauled":"The component's hours start over at zero against its limit.","Other repair or work":"Recorded on the aircraft's history; no clock changes."}[m.type];
  el.innerHTML=`<div class="dw-scrim" data-lmclose></div><aside class="drawer" role="dialog" aria-label="Log maintenance">
  <div class="dw-h"><div><span class="pill plain" style="background:var(--sunk)">Maintenance</span><h2 class="dw-t">Log maintenance · ${m.tail}</h2><p class="muted" style="margin:0">Records the work and resets the right clock.</p></div><button class="btn small" data-lmclose aria-label="Close">✕</button></div>
  <div class="dw-b">
    <label class="field">Work done<select id="lmType">${LM_TYPES.map(t=>`<option ${m.type===t?"selected":""}>${t}</option>`).join("")}</select></label>
    ${m.type==="Component replaced or overhauled"?`<div class="dw-grid"><label class="field">Component<select id="lmComp">${M.comp.map((c,i)=>`<option value="${i}" ${+m.comp===i?"selected":""}>${esc(c[0])}</option>`).join("")}</select></label><label class="field">New calendar limit<input id="lmCal" type="date" value="${esc(m.cal)}"></label></div>`:""}
    ${m.type==="ELT battery replaced"?`<label class="field">New battery expires<input id="lmBat" type="date" value="${esc(m.bat)}"></label>`:""}
    <div class="dw-grid"><label class="field">Date<input id="lmDate" type="date" value="${esc(m.date)}"></label><label class="field"><span class="rdh">Tach at the time<span class="rdout">Now <b class="mono">${a.tach.toFixed(1)}</b></span></span><input id="lmTach" class="mono" inputmode="decimal" value="${esc(m.tachAt)}"></label></div>
    <label class="field">Notes<textarea id="lmNote" rows="2" placeholder="What was done, parts used">${esc(m.note)}</textarea></label>
    <label class="field">Logbook entry <span class="muted" style="font-weight:400">(photo or PDF, optional)</span><input id="lmFile" type="file" accept="image/*,application/pdf"></label>
    <div class="lm-eff">${effect}</div>
    <div id="lmErr" class="err-b" ${m.err?"":"hidden"}>${esc(m.err)}</div>
    <div class="fuelp"><button class="btn primary" data-lmsave>Save entry</button><button class="btn" data-lmclose>Cancel</button></div>
  </div></aside>`}
function saveLM(){const m=LM,a=AIRCRAFT.find(x=>x.tail===m.tail),M=AC_MX[m.tail],t=parseFloat(m.tachAt),bad=x=>{m.err=x;renderLM()};
  if(!m.date)return bad("Pick the date the work was done.");
  if(isNaN(t)||t<=0)return bad("Enter the tach reading when the work was done.");
  if(t>a.tach+0.05)return bad(`That's above the current tach (${a.tach.toFixed(1)}).`);
  let did="";
  if(m.type==="100-hour inspection"){a.next100=+(t+100).toFixed(1);did=`next 100-hour at tach ${a.next100.toFixed(1)}`}
  else if(m.type==="Annual inspection"){a.annualIso=endOfMonthPlus(m.date,12);a.annual=fmtD(a.annualIso);did="next annual "+a.annual}
  else if(m.type==="Oil change"){a.oilDue=+(t+50).toFixed(1);did=`next oil change at tach ${a.oilDue.toFixed(1)}`}
  else if(m.type==="ELT inspection"){const i=M.insp.findIndex(x=>x[0].startsWith("ELT (12"));M.insp[i][1]=endOfMonthPlus(m.date,12);did="next ELT inspection "+fmtD(M.insp[i][1])}
  else if(m.type==="ELT battery replaced"){if(!m.bat)return bad("Enter the new battery's expiration date.");const i=M.insp.findIndex(x=>x[0]==="ELT battery");M.insp[i][1]=m.bat;did="battery good to "+fmtD(m.bat)}
  else if(m.type==="Transponder check"){const i=M.insp.findIndex(x=>x[0]==="Transponder");M.insp[i][1]=endOfMonthPlus(m.date,24);did="next transponder check "+fmtD(M.insp[i][1])}
  else if(m.type==="Component replaced or overhauled"){const c=M.comp[+m.comp];if(!m.cal)return bad("Pick the new calendar limit.");c[1]=+(c[3]||2200).toFixed(1);c[2]=m.cal;did=`${c[0]} back to ${c[1].toLocaleString()} hr`}
  else if(!m.note.trim())return bad("Describe the work in the notes.");
  a.ohRem=Math.min(...M.comp.map(x=>x[1]).concat([99999]));a.status=acStatus(a)==="ok"?"ok":"warn";
  saveAcRecord(a);D.push("mxLog",{tail:a.tail,date:m.date,tach:t,type:m.type,note:m.note.trim(),file:m.file||"",by:ME});
  LM=null;renderLM();render();toast(`${m.type} logged for ${a.tail}${did?": "+did:""}.`)}

/* sample bookings for days other than today (the demo only tracks today live) */
function sampleDay(d){
  const dow=d.getDay(),k=d.getDate()+d.getMonth()*31,on=i=>(k+i)%3!==0,past=d<today,out=[];
  const stu=["Jordan Kim","Sam Patel","Chris Morgan","Taylor Brooks","Jordan Kim"]; // J. Snuffy's own lessons live in his app
  const add=(ac,who,s,e,type,t)=>out.push({ac,who,s,e,type,t,st:past?"done":"up",sample:true});
  if(dow!==0){
    [[8,9.5,"J. Nichols"],[10,12,"M. Houston"],[13,14.5,"J. Nichols"],[15,17,"M. Houston"]].forEach(([s0,e0,w],i)=>{if(on(i))add("N7187K",w,s0,e0,"dual",stu[(k+i)%5]+" · F"+(10+(k+i)%20))});
    if(on(4))add(null,"J. Nichols",16,17,"ground",stu[(k+2)%5]+" · G"+(3+(k%9)));
  }
  if(dow===5||dow===6||dow===0)add("N931QA","R. Ellis",10,15,"tour","Tour block · walk-ups");
  else if(on(5))add("N931QA","J. Nichols",9,11,"job","AS&S · Aerial survey");
  if(dow===2&&on(6))add("N931QA",null,13,15,"mx","Squawk follow-up");
  return out;
}

let FX=null; // {title,tag,sub,fields,body(),save(vals),saveLbl,act(name,el),wide}
function closeOthers(){BK=null;NB=null;AF=null;LM=null;ATN=false}
function openFX(o){closeOthers();FX=Object.assign({err:""},o);renderFX()}
function fxField(f){const v=f.val??"",id="fx_"+f.k,full=f.full?' style="grid-column:1/-1"':"";
  const lbl=f.opt?`<span>${f.l} <span class="muted" style="font-weight:400">(optional)</span></span>`:f.l;
  if(f.type==="select")return `<label class="field"${full}>${lbl}<select id="${id}">${f.opts.map(o=>{const [ov,ol]=Array.isArray(o)?o:[o,o];return `<option value="${esc(ov)}" ${String(ov)===String(v)?"selected":""}>${esc(ol)}</option>`}).join("")}</select></label>`;
  if(f.type==="textarea")return `<label class="field" style="grid-column:1/-1">${lbl}<textarea id="${id}" rows="${f.rows||3}" ${f.ph?`placeholder="${esc(f.ph)}"`:""}>${esc(v)}</textarea></label>`;
  if(f.type==="check")return `<label class="chk" style="grid-column:1/-1"><input type="checkbox" id="${id}" ${v?"checked":""}> ${f.l}</label>`;
  if(f.type==="file")return `<label class="field"${full}>${lbl}<input type="file" id="${id}" ${f.accept?`accept="${f.accept}"`:""}>${v?`<span class="muted" style="font-size:12px">On file: ${esc(v)}</span>`:""}</label>`;
  return `<label class="field"${full}>${lbl}<input id="${id}" type="${f.type==="number"?"text":f.type||"text"}" value="${esc(v)}" ${f.ph?`placeholder="${esc(f.ph)}"`:""} ${f.type==="number"?'inputmode="decimal" class="mono"':""}></label>`}
function fxVals(){const o={};(FX.fields||[]).forEach(f=>{const el=$("fx_"+f.k);if(!el)return;
  o[f.k]=f.type==="check"?el.checked:f.type==="file"?(el.files&&el.files[0]?el.files[0].name:f.val||""):f.type==="number"?el.value.trim():el.value;
  if(f.type==="file"&&el.files&&el.files[0])o[f.k+"File"]=el.files[0]});return o}
function renderFX(){const el=$("drawer"),f=FX;if(!f){el.innerHTML="";return}
  el.innerHTML=`<div class="dw-scrim" data-fxclose></div><aside class="drawer ${f.wide?"wide":""}" role="dialog" aria-label="${esc(f.title)}"><div class="dw-h"><div>${f.tag?`<span class="pill plain" style="background:var(--sunk)">${esc(f.tag)}</span>`:""}<h2 class="dw-t">${esc(f.title)}</h2>${f.sub?`<p class="muted" style="margin:0">${f.sub}</p>`:""}</div><button class="btn small" data-fxclose aria-label="Close">✕</button></div>
  <div class="dw-b">${f.body?f.body():""}${f.fields&&f.fields.length?`<div class="dw-grid">${f.fields.map(fxField).join("")}</div>`:""}
  <div id="fxErr" class="err-b" ${f.err?"":"hidden"}>${esc(f.err)}</div>
  ${f.save?`<div class="actions" style="margin-top:14px"><button class="btn primary" data-fxsave>${f.saveLbl||"Save"}</button><button class="btn" data-fxclose>Cancel</button></div>`:""}</div></aside>`}
function fxSave(){const v=fxVals();(FX.fields||[]).forEach(f=>{if(f.k in v&&f.type!=="file")f.val=v[f.k]});

    const hrs=f.end-f.start-f.brk/60;if(hrs>16){f.err="That's more than 16 hours. Check the times.";render();return}

    hForm={d:0,start:8,end:16.5,brk:30,note:"",err:""};render();toast(hrs.toFixed(2)+" hours saved for "+fmtDate(addDays(today,f.d)));return}
  if(t.dataset.hdel){const del=D.get("timeDeleted",[]);del.push(t.dataset.hdel);D.set("timeDeleted",del);render();toast("Hours removed. The change is logged.");return}
  if(t.dataset.bk){openBk(t.dataset.bk);return}

  if(["hDay","hStart","hEnd","hBrk"].includes(el.id)){const k={hDay:"d",hStart:"start",hEnd:"end",hBrk:"brk"}[el.id];hForm[k]=+el.value;hForm.err="";const pv=$("hPrev");if(pv)pv.textContent=Math.max(0,hForm.end-hForm.start-hForm.brk/60).toFixed(2);const er=$("hErr");if(er)er.hidden=true;return}
