<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>AS&amp;S Scheduler Demo · Student</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one phone-width app column, centered on wide screens with a quiet caption above; bottom tab bar, sheets slide up inside the app. */
:root{
  --bg:#e9edf1; --app:#f6f8fa; --surface:#ffffff; --ink:#122131; --muted:#5b6b7c; --line:#d8dfe6;
  --accent:#1d5ea8; --accent-ink:#ffffff; --accent-soft:#e3edf8;
  --ok:#1f7a4a; --ok-soft:#e2f2e9; --warn:#a56200; --warn-soft:#fbefd9; --bad:#b3261e; --bad-soft:#fbe5e3;
  --display:"Saira Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:var(--body); /* numbers use the regular font with evenly spaced digits */ --code:"IBM Plex Mono",ui-monospace,Menlo,monospace; /* METAR only */
  --shadow:0 1px 2px rgba(18,33,49,.06),0 8px 24px rgba(18,33,49,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1219; --app:#111a23; --surface:#18232f; --ink:#e6edf3; --muted:#93a3b3; --line:#2a3846;
  --accent:#5fa2ec; --accent-ink:#06121f; --accent-soft:#1a3049;
  --ok:#5cc58b; --ok-soft:#173326; --warn:#f0b357; --warn-soft:#3a2a10; --bad:#f2847b; --bad-soft:#3d1a18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1219; --app:#111a23; --surface:#18232f; --ink:#e6edf3; --muted:#93a3b3; --line:#2a3846;
  --accent:#5fa2ec; --accent-ink:#06121f; --accent-soft:#1a3049;
  --ok:#5cc58b; --ok-soft:#173326; --warn:#f0b357; --warn-soft:#3a2a10; --bad:#f2847b; --bad-soft:#3d1a18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.caption{max-width:420px;margin:0 auto 12px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.caption b{color:var(--ink);font-weight:600}
.app{position:relative;max-width:420px;margin:0 auto;background:var(--app);border:1px solid var(--line);border-radius:28px;overflow:hidden;
  min-height:760px;display:flex;flex-direction:column;box-shadow:var(--shadow)}
@media (max-width:460px){.app{border-radius:20px;min-height:calc(100vh - 80px)}}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 10px}
.brand{font-family:var(--display);font-weight:700;letter-spacing:.06em;font-size:15px;text-transform:uppercase}
.brand span{color:var(--accent)}
.avatar{position:relative;width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:13px}
.dot-need{position:absolute;top:-1px;right:-1px;width:10px;height:10px;border-radius:50%;background:var(--warn);border:2px solid var(--app)}
.doccard{display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px}
.doccard b{display:block}
.doccard span span,.doccard > span:nth-child(2) > span{display:block;font-size:13px;color:var(--muted)}
.doccard .dc-ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--accent-soft);color:var(--accent)}
.doccard.need{border-color:var(--warn)} .doccard.need .dc-ic{background:var(--warn-soft);color:var(--warn)}
.doccard.ok .dc-ic{background:var(--ok-soft);color:var(--ok)}
.doccard .dc-go{font-weight:600;color:var(--accent);font-size:14px}
.doclist{display:flex;flex-direction:column;gap:8px}
.docrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px}
.dr-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.dr-t span{font-size:13px;color:var(--muted)}
.pickrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{cursor:pointer}
.docprev{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface)}
.docprev img,.docprev .pdf{width:64px;height:64px;border-radius:8px;object-fit:cover;background:var(--app)}
.docprev .pdf{display:grid;place-items:center;font:600 13px var(--mono);color:var(--bad)}
.docprev b{display:block;word-break:break-all;font-size:14px}
main{flex:1;padding:4px 18px 24px;display:flex;flex-direction:column;gap:14px;min-width:0}
h1{font-family:var(--display);font-weight:600;font-size:26px;line-height:1.1;margin:4px 0 0;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 0 0}
.sub{color:var(--muted);margin:0;font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* next lesson */
.lesson{display:flex;flex-direction:column;gap:12px}
.lesson-when{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.lesson-when .day{font-family:var(--display);font-size:28px;font-weight:700;line-height:1}
.lesson-when .time{font-family:var(--mono);font-size:16px;color:var(--muted)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin:0}
.facts div{min-width:0}
.facts dt{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.facts dd{margin:2px 0 0;font-weight:500}
.objective{background:var(--app);border-radius:10px;padding:10px 12px;font-size:14px}
.objective b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;margin-bottom:2px}
.mx-row{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:12px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:12px 16px;font-weight:600;min-height:46px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{border:1px solid var(--line);background:var(--surface)}
.btn.small{min-height:36px;padding:7px 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn.danger{color:var(--bad);border:1px solid var(--line);background:var(--surface)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat .k{font-size:12px;color:var(--muted)} .stat .v{font-family:var(--display);font-size:22px;font-weight:600}
.cal{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.cal .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}

/* book */
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.day-btn{flex:0 0 auto;width:56px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 0;text-align:center}
.day-btn .dow{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.day-btn .dn{font-family:var(--display);font-size:20px;font-weight:600}
.day-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day-btn[aria-pressed="true"] .dow{color:inherit;opacity:.85}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 0;font-family:var(--mono);font-size:15px}
.slot:hover{border-color:var(--accent)}
.empty{color:var(--muted);font-size:14px;padding:14px;text-align:center;border:1px dashed var(--line);border-radius:12px}
.note{font-size:13px;color:var(--muted)}

/* lessons list */
.list{display:flex;flex-direction:column;gap:10px}
.li{display:flex;flex-direction:column;gap:8px}
.li-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.li-title{font-weight:600}
.li-meta{font-size:13px;color:var(--muted)}
.li-actions{display:flex;gap:8px;flex-wrap:wrap}
.notes{font-size:14px;border-left:3px solid var(--line);padding-left:10px;color:var(--ink)}
.confirm-box{background:var(--bad-soft);border-radius:10px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:8px}

/* progress */
.meter{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.ms{display:flex;flex-direction:column;gap:0}
.ms-i{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ms-i:last-child{border-bottom:0}
.ms-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--line)}
.ms-i.done .ms-dot{background:var(--ok);border-color:var(--ok)}
.ms-i.next .ms-dot{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ms-i .when{font-size:12px;color:var(--muted)}
.hours{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}

/* nav */
nav{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);
  padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:500;color:var(--muted);border-radius:10px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="page"]{color:var(--accent)}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(10,18,26,.45);display:flex;align-items:flex-end;z-index:5}
.sheet{background:var(--app);width:100%;border-radius:22px 22px 0 0;padding:10px 18px 22px;max-height:92%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 4px}
.sheet{position:relative}
/* same close button in the same corner on every panel */
.xclose{position:absolute;top:10px;right:12px;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:15px;display:grid;place-items:center;z-index:2}
.xclose:hover{color:var(--ink)}
.mx{display:flex;flex-direction:column}
.mx-i{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:11px 0;border-bottom:1px solid var(--line);align-items:center}
.mx-i:last-child{border-bottom:0}
.mx-i .lbl{font-weight:500}
.mx-i .val{font-size:13px;color:var(--muted);grid-column:1}
.mx-i .pill{grid-row:1 / span 2;grid-column:2}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.summary div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.summary .k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.summary .v{font-family:var(--mono);font-size:17px}
.toast{position:absolute;left:18px;right:18px;bottom:84px;background:var(--ink);color:var(--app);border-radius:12px;padding:12px 14px;font-size:14px;z-index:6;box-shadow:var(--shadow)}
.demo{border:1px dashed var(--warn);color:var(--warn);background:var(--warn-soft);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;text-align:left}
.steps{display:flex;gap:6px;font-size:12px;font-weight:600}
.steps span{flex:1;text-align:center;padding:6px 4px;border-radius:8px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.steps .on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.steps .done{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields.three{grid-template-columns:repeat(3,1fr)}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.fld input,.fld textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-width:0}
.fld input.mono{font-family:var(--mono)}
.fld input:focus,.fld textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{width:20px;height:20px;margin:0;accent-color:var(--accent);flex:none}
.err{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:500}
.wb{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 10px;border-radius:12px;padding:10px 12px;background:var(--surface);border:1px solid var(--line)}
.wb.warn{border-color:var(--warn)} .wb.bad{border-color:var(--bad)}
.bill{width:100%;border-collapse:collapse;font-size:14px}
.bill td{padding:8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.bill td:last-child{text-align:right;padding-left:12px;white-space:nowrap}
.bill .tot td{border-bottom:0;font-weight:600;font-size:16px;padding-top:10px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.opt span{font-size:13px;color:var(--muted)}
.opt[aria-checked="true"]{border:2px solid var(--accent);padding:11px 13px}
.opt:disabled{opacity:.5;cursor:not-allowed}
.paid{align-self:flex-start;font-family:var(--display);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ok);background:var(--ok-soft);padding:4px 12px;border-radius:8px}
.linkbtn{align-self:flex-start;color:var(--accent);font-weight:600;font-size:14px;padding:2px 0;text-decoration:underline;text-underline-offset:3px}
.changed{background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:13.5px}
.opt:disabled span{color:var(--bad)}
.chart{padding:8px}
.quick{display:flex;gap:6px;height:100%}
.qbtn.sy{border-color:var(--accent);color:var(--accent)}
.qbtn{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;font:500 14px var(--mono);min-height:44px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border-radius:9px;padding:9px 0;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.gpill{background:var(--accent-soft);color:var(--accent)}
.gcard{display:flex;flex-direction:column;gap:6px;padding:12px 16px}
.prog{display:flex;flex-direction:column;gap:8px}
.pbar{display:flex;justify-content:space-between;font-size:13px}
.meter.small{height:8px}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stage summary{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;font-weight:600;list-style:none}
.stage summary::-webkit-details-marker{display:none}
.stage summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-left:6px;flex:none}
.stage[open] summary::after{transform:rotate(-135deg)}
.stage summary span:first-child{flex:1}
.syl{border-top:1px solid var(--line)}
.syl-w{border-bottom:1px solid var(--line)}
.syl-w:last-child{border-bottom:0}
.syl-w.open{background:var(--app)}
.syl-i{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:10px 16px;cursor:pointer}
.syl-i:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.syl-r{display:flex;align-items:center;gap:8px}
.chev{width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 2px 3px}
.syl-w.open .chev{transform:rotate(-135deg);margin:3px 2px 0}
.ldet{padding:2px 16px 14px 66px;display:flex;flex-direction:column;gap:4px;font-size:14px}
@media (max-width:420px){.ldet{padding-left:16px}}
.ldet h3{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 0}
.ldet p{margin:0}
.ld-time{font-size:12.5px;color:var(--accent);font-weight:600}
.ld-items,.ld-comp{margin:2px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.ld-items li span{display:block;font-size:12.5px;color:var(--muted)}
.ld-notes{border-left:3px solid var(--accent);padding-left:10px}
.syl-i.is-done .syl-t{color:var(--muted)}
.syl-t{display:flex;flex-direction:column;gap:1px;font-size:14px;min-width:0}
.code{font:600 12px var(--mono);text-align:center;padding:3px 0;border-radius:6px}
.code.f{background:var(--accent-soft);color:var(--accent)} .code.g{background:var(--warn-soft);color:var(--warn)}
.st{font-size:12px;font-weight:600;white-space:nowrap}
.st.done{color:var(--ok)} .st.sched{color:var(--accent)}
.times{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tcol{display:flex;flex-direction:column;gap:4px;min-width:0}
.th{font-size:12px;color:var(--muted)}
.tout{display:flex;align-items:baseline;gap:6px;font-size:13px}
.tout .mono{font-size:14px;font-weight:400;color:var(--ink)}
.tout .k{color:var(--muted)}
.tin .k{display:none}
.tin{display:flex;flex-direction:column;gap:4px}
.tin input{font:16px var(--mono);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-width:0}
.tin input:focus{outline:2px solid var(--accent);outline-offset:1px}
.tdiff{font-size:12px;font-weight:600;color:var(--ok);font-family:var(--mono)}
.tdiff.bad{color:var(--bad)}
.presets.three{grid-template-columns:repeat(3,1fr)}
.asinstr{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:13.5px}
.fuelsel{display:flex;flex-direction:column;gap:10px}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pre{display:flex;flex-direction:column;align-items:center;gap:1px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 0}
.pre b{font-family:var(--display);font-size:17px}
.pre span{font-size:11px;color:var(--muted)}
.pre[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pre[aria-pressed="true"] span{color:inherit;opacity:.85}
#fuelR{width:100%;accent-color:var(--accent);height:28px;margin:0}
.lastin{font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.lastin .k{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.safetybtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px}
.safetybtn b{color:var(--bad)}
.safetybtn span{font-size:13px;color:var(--muted)}

ind takeoff from a hover",[]],["Normal/crosswind approach to a hover",[]],["Traffic pattern procedures",[]],["Vertical takeoff to a hover",[]],["Landing from a hover",[]],["Ground reference maneuvers",[]],["Sideward, forward, and rearward hovering",[]],["Hovering turns",[]],["Hover taxi",[]]],"comp":["The student will increase proficiency in attitude control during takeoffs and approaches and he will understand how crosswind components affect these maneuvers."],"study":""},"F5":{"obj":"The student will practice basic maneuvers, concentrating on hovering.","items":[["Vertical takeoff to a hover",[]],["Hovering – sideward, forward, rearward and turns",[]],["Normal/crosswind takeoff from a hover",[]],["Normal/crosswind approach to a hover",[]],["Landing from a hover",[]],["Ground reference maneuvers",[]],["Hover taxi",[]]],"comp":["The student will show increased proficiency during takeoffs, traffic pattern operations, approaches and hovering."],"study":""},"F6":{"obj":"The student will continue to practice basic maneuvers.","items":[["Vertical takeoff to a hover",[]],["Hovering – sideward, forward, rearward and turns",[]],["Normal/crosswind takeoff from a hover",[]],["Normal/crosswind approach to a hover",[]],["Hover taxi",[]]],"comp":["The student will show increased proficiency during takeoffs, traffic pattern operations, approaches and hovering."],"study":""},"F7":{"obj":"The student will continue to practice pre-solo maneuvers and will be introduced to maximum performance takeoffs and steep approaches.","items":[["Vertical takeoff to a hover",[]],["Hovering",[]],["Normal takeoff from a hover",[]],["Normal approach to a hover",[]],["Landing from a hover",[]],["Maximum performance takeoff and climb",[]],["Steep approach",[]],["Steep Turns – 30 degree bank angle",[]],["Air Taxi",[]]],"comp":["The student will demonstrate proper radio communications and traffic pattern procedures. Takeoffs will be performed unassisted, but approaches will be performed with instructor tor failure","Electrical fire or smoke in the cockpit","Tachometer failure","Caution lights","Warning lights","RHC safety notices"]],["Settling with power – recognition and recovery",[]],["Governor failure",[]]],"comp":["At the completion of this lesson the student will show increased proficiency in all pre- solo maneuvers. During straight and level flight and turns, altitude will be maintained within 200 feet, airspeed within 15 kts, and heading within 20 degrees. During climbs and descents the level off will be accomplished within 200 feet of the assigned altitude, airspeed will be maintained within 15 kts, and heading within 20 degrees. He will gain an understanding of the conditions that result in settling with power and systems and equipment malfunctions. During governor off operations, rpm will be maintained within 4%."],"study":""},"F12":{"obj":"During this lesson the student will continue to practice autorotations and be introduced to the recognition and recovery techniques of recovery from low rotor rpm.","items":[["Straight in autorotation",[]],["Takeoffs and approaches",[]],["Rapid decelerations – quick stops",[]],["Governor failure",[]],["Recognition and recovery from low rotor rpm",["During cruise flight","On takeoff","At a hover"]],["Hovering autorotation",[]]],"comp":["During straight in autorotation, the student will demonstrate proper entry techniques, maintain airspeed between 55 and 75 kts and rotor rpm in the green. He will gain an understanding of the effects of low rotor rpm, its recognition and proper recovery techniques."],"study":""},"F13":{"obj":"This lesson will be a review of important pre-solo maneuvers.","items":[["Takeoffs and approaches",[]],["Hovering – sideward, rearward, forward and turns",[]],["Straight in autorotation",[]],["Hovering autorotation",[]],["Rapid decelerations – quick stops",[]],["Recognition and recovery from low rotor rpm",[]],["Settling with power – recognition and recovery",[]],["Governor failure",[]]],"comp":["The student will demonstrate increased proficiency in all pre-solo maneuvers. During governor off operations, rpm will be maintained within 3%."],"study":""},"F14":{"obj":"During this lesson the student will be introduced to 180 degree autorotation and the effects of turns during autorotative descents.","items":[["Pre-solo maneuvers as necessary",[]],["180 degree autorotation with power recovery",[]],["Simulated engine failure – Forced landing",[]]],"comp":["The student will gain an understanding of the importance of attitude and rpm control during 180 degree autorotation. During forced landings the student will understand the need to immediately lower the collective to prevent a low rotor rpm situation and techniques for controlling rpm during autorotative descents."],"study":""},"F15":{"obj":"During this lesson the student will continue practicing pre-solo maneuvers, concentrating on takeoffs, approaches and autorotations.","items":[["Normal takeoffs and approaches",[]],["Maximum performance takeoffs and climbs",[]],["Steep approaches",[]],["180 degree autorotation with power recovery",[]],["Simulated engine failure – Forced landing",[]]],"comp":["During takeoffs, student will be able to maintain proper attitude control and heading.","During approaches, proper approach angles will be maintained with only minor corrections and rate of closure will not be excessive.","Entry into autorotation will be smooth, exercising proper attitude, trim, and rpm control. The flare and power recovery will be performed at prescribed altitudes.","During forced landings the student will lower the collective so as to prevent the rpm from decaying below 90%."],"study":""},"F16":{"obj":"This lesson is a review of all pre-solo maneuvers in preparation for the student's first supervised solo. During this lesson, the RHC safety checkout will be completed.","items":[["ATC/Traffic pattern procedures",[]],["Emergency procedures and equipment malfunctions",[]],["Preflight inspection",[]],["Engine starting",[]],["Engine and systems preflight check",[]],["Vertical takeoff to a hover",[]],["Hovering - sideward, rearward, forward and turns",[]],["Radio communications",[]],["Normal takeoff from a hover",[]],["Traffic pattern procedures/collision avoidance precautions",[]],["Autorotative descents with power recovery",[]],["Hovering autorotation",[]],["Simulated engine failure – Forced landing",[]],["Normal approach to a hover",[]],["Recognition and recovery from low rpm",[]],["Governor failure",[]],["Landing from a hover",[]]],"comp":["The student will demonstrate the knowledge and proficiency to safety solo the helicopter."],"study":""},"F17":{"obj":"During this stage check the Chief Flight Instructor or a designated instructor will evaluate the student's proficiency on the listed Stage 1 maneuvers and procedures to determine if the student is ready to solo the helicopter and be advanced to Stage 2.","items":[["Preflight inspection",[]],["Engine starting",[]],["Engine and systems preflight check",[]],["Vertical takeoff to a hover",[]],["Hovering - sideward, rearward, forward and turns",[]],["Radio communications",[]],["Normal takeoffs from a hover",[]],["Traffic pattern procedures/collision avoidance precautions",[]],["Autorotative descents with power recovery",[]],["Hovering autorotation",[]],["Simulated engine failure – Forced landing",[]],["Recognition and recovery from low rpm",[]],["Rapid decelerations - quick stops",[]],["Normal approach to a hover",[]],["Governor failure",[]],["Engine shutdown",[]],["Pilot's Operating Handbook",["Airworthiness requirements","Limitations","Normal procedures","Emergency procedures"]],["RHC Safety Notices",[]],["FAR Parts 61 and 91",[]],["Airspace rules and airport procedures",[]]],"comp":["This lesson and Stage 1 will be complete when the student displays skill and understanding while performing the maneuvers necessary to safety conduct solo flights in the local training area. He will maintain altitude within 150 feet, airspeed within 15 kts, and heading within 15 degrees. During governor off operations, rpm will be maintained within 2%. The student will also demonstrate sufficient knowledge of emergency operations, the R22/R44 Pilot's Operating Handbook, and RHC Safety Notices."],"study":""},"F18":{"obj":"During this lesson the instructor will review all Stage 1 and pre-solo requirements to check the student's readiness for solo flight. During the second portion of this lesson, the student will conduct his first supervised solo flight.","items":[["FAR Parts 61 and 91",[]],["R22/R44 limitations and flight characteristics",[]],["Airspace rules and airport procedures",[]],["Energy management",[]],["Mast bumping",[]],["Low G hazards",[]],["Rotor rpm decay",[]],["Normal/crosswind takeoffs and approaches",[]],["Hovering maneuvers",[]],["Radio communications",[]],["Straight in autorotations",[]],["Emergency procedures and equipment malfunctions",[]],["Vertical takeoffs to a hover",[]],["Hovering",[]],["Landings from a hover",[]],["Three normal takeoffs, traffic patterns, and normal approaches",[]]],"comp":["The dual portion of this lesson will be complete when the instructor has reviewed the student logbook to ensure all flight time and maneuver requirements have been met, has made the appropriate FAR Part 61 and SFAR 73 endorsements, and has reviewed with the student all incorrect answers to the pre-solo written test. The student will demonstrate the ability to safely solo the helicopter while adhering to established traffic pattern procedures and must satisfactorily pass the pre-solo written test with a minimum score of 80%. The solo portion of the lesson when the student has completed the first supervised solo flight."],"study":""},"F19":{"obj":"During the dual portion of this lesson, the instructor will review takeoff, traffic pattern, and approach procedures to check the student's readiness for the second supervised solo flight. During the solo portion of the lesson the student will conduct his second supervised solo flight.","items":[["Normal takeoff from a hover",[]],["Traffic pattern procedures",[]],["Hovering",[]],["Normal approach to a hover",[]],["Slope landings",[]],["Slope takeoffs",[]],["Vertical takeoffs to a hover",[]],["Hovering",[]],["Landings from a hover",[]],["Three normal takeoffs, traffic patterns, and normal approaches",[]]],"comp":["The student will gain confidence in his ability to safely solo the helicopter."],"study":""},"F20":{"obj":"During this lesson the student will review pre-solo maneuvers in preparation for his third supervised solo flight.","items":[["Maximum performance takeoffs",[]],["Steep approaches",[]],["Hovering autorotation",[]],["Autorotative descents with power recovery",[]],["Recognition and recovery from low rotor rpm",[]],["Slope takeoffs and landings",[]],["Vertical takeoffs to a hover",[]],["Hovering",[]],["Landings from a hover",[]],["Normal takeoffs, traffic patterns, and normal approaches",[]]],"comp":["The student will increase his proficiency in advanced maneuvers and gain additional confidence in his ability to safely solo the helicopter."],"study":""},"F21":{"obj":"During this lesson the student will practice the listed maneuvers to increase his proficiency and confidence in solo flight.","items":[["Maximum performance takeoff and climb",[]],["Steep approach",[]],["Normal takeoff from a hover",[]],["Normal approach to a hover",[]],["Hovering – sideward, rearward, forward and turns",[]]],"comp":["This lesson will be complete when the student has practiced the assigned maneuvers."],"study":""},"F22":{"obj":"This lesson will introduce the student to off-airport operations in confined areas, and will stress the importance of performance planning and off-airport operating procedures. The student will gain an understanding of hazards associated with off-airport operations and review those previously covered.","items":[["Weight and balance calculations and considerations",[]],["Performance planning",["Limit manifold pressure – maximum power available","Hover performance – IGE, OGE","Never exceed speed Review"]],["Settling with power",[]],["Power failure at altitude – Forced landing",[]],["Confined area and pinnacle operations",["High reconnaissance","Low reconnaissance","Confined area & pinnacle approach and departure"]],["Hazardous conditions",["Obstructions – natural and man-made","Landing surface conditions","Dynamic rollover – slope operations"]]],"comp":["This lesson will be complete when the student demonstrates the ability to plan and execute a high and low reconnaissance. He will be able to select suitable landing areas and demonstrate good judgment in his traffic pattern procedures."],"study":""},"F23":{"obj":"During this lesson, the student will be introduced to shallow approaches to a running landing and some of the emergencies that may require a running landing.","items":[["Normal takeoff from a hover",[]],["Normal approach to a hover",[]],["Traffic pattern procedures",[]],["Autorotative descents with power recovery",[]],["Hovering autorotation",[]],["Recognition and recovery from low rotor rpm",[]],["Partial power failure",[]],["Shallow approach and running landings",[]]],"comp":["The student will gain an understanding of what conditions necessitate more advanced takeoffs and approaches. During autorotative descents the student will maintain airspeed between 60 and 75 kts and rotor rpm within the green range. Directional control during simulated power failure at a hover will be within 10 degrees and proper drift control will be exercised. The student will be able to recognize and recover from a low rpm situation prior to the rpm decaying below 90%. The student will gain an understanding of the conditions requiring a shallow approach and running landing."],"study":""},"F24":{"obj":"During this lesson the student will practice the maneuvers assigned by the instructor to increase proficiency and solo experience.","items":[["Maneuvers assigned by the flight instructor",[]]],"comp":["This lesson will be complete when the student has practiced the listed maneuvers."],"study":""},"F25":{"obj":"During this lesson the student will review off-airport operations in confined areas and running landings.","items":[["Maximum performance takeoff and climb",[]],["Steep approach",[]],["Confined area and pinnacle operations",[]],["Slope operations",[]],["Shallow approach and running landing",[]]],"comp":["The student will demonstrate proper attitude and power control during high altitude takeoffs and maximum performance takeoffs. Heading will be maintained within 15 degrees during maximum performance takeoffs and a smooth transition to normal climb will be demonstrated. The student will maintain translational lift until ground contact during a shallow approach and running landing and demonstrate proper use of the cyclic during slope operations. During straight and level flight and turns, altitude will be maintained within 100 feet, airspeed within 10 kts, and heading within 10 degrees. The student will properly conduct the high/low reconnaissance when conducting confined area operations and select an approach angle that will ensure obstacle clearance."],"study":""},"F26":{"obj":"This lesson will familiarize the student with the special considerations and characteristics of helicopter flight at night.","items":[["Preflight planning",["Night flight planning considerations","Preflight inspection for night flight","Night vision techniques","Personal lighting devices"]],["Night Flight",["Hovering","Use of landing/search light and other switches/circuit breakers","Normal takeoff from a hover","Local area night orientation","Traffic pattern operations","Normal approach to a hover","Airport lighting","Straight in autorotation","Hovering autorotation"]]],"comp":["The student will become familiar with helicopter flight in the night environment, including airport/heliport lighting; locating and identifying switches, circuit breakers, etc.; and the types and uses of various personal lighting devices."],"study":""},"F27":{"obj":"During this lesson the student will practice the maneuvers assigned by the instructor to increase proficiency and solo experience.","items":[["Maneuvers assigned by the flight instructor",[]]],"comp":["This lesson will be complete when the student has practiced the listed maneuvers."],"study":""},"F28":{"obj":"During this lesson the student will review Stage 2 maneuvers in preparation for the Stage 2 flight check.","items":[["Confined area and pinnacle operations",[]],["Maximum performance takeoff and climb",[]],["Steep approach",[]],["Anti-torque failure",[]],["Shallow approach and running landings",[]],["Autorotative descents",[]],["Slope operations",[]],["Rapid deceleration – quick stops",[]],["Recovery from low rotor rpm",[]],["Partial power failure",[]],["Hovering autorotation",[]],["Systems and equipment malfunctions",[]],["Simulated engine failure – Forced landing",[]],["Maneuvers selected by the instructor",[]]],"comp":["At the completion of this lesson, the student will have demonstrated increased proficiency in all advanced maneuvers. He will demonstrate early recognition and immediate recovery from all hazardous flight conditions and a good understanding of off-airport operations, emergencies, and systems and equipment malfunctions."],"study":""},"F29":{"obj":"During this lesson, the Chief Flight Instructor or a designated instructor will determine that the student meets the knowledge, proficiency and performance standards required in performing advanced maneuvers and off-airport operations.","items":[["Weight and balance computation",[]],["Performance planning",[]],["Hazardous conditions",["Adverse winds and turbulence","Settling with power","Dynamic rollover Review"]],["Confined area and pinnacle operations",[]],["Shallow approach/running landing",[]],["Slope operations",[]],["Autorotative descents",[]],["Rapid deceleration – quick stops",[]],["Recovery from low rpm",[]],["Hovering autorotation",[]],["Simulated engine failure – Forced landing",[]],["Maneuvers selected by the instructor",[]]],"comp":["During takeoffs and climbs, the student will demonstrate proper attitude and heading control.","During approaches, proper sight picture, rate of closure, and ground track will be demonstrated.","While conducting slope operations the student will demonstrate proper use of the cyclic and collective.","During autorotative descents rotor rpm will be maintained in the green arc. Airspeed will be maintained between 60 to 70 kts, and the power recovery will be executed smoothly and properly.","While executing a hovering autorotation, the student will maintain heading with 10 degrees and proper drift control will be exercised.","The student will demonstrate knowledge and understanding of systems and equipment malfunctions.","The student will be able to recognize and recover from low rpm prior to 90%.","The student will exercise proper planning and good judgment with conducting off- airport operations."],"study":""},"F30":{"obj":"During this lesson the student will be introduced to helicopter cross-country planning and procedures. The flight will consist of at least two legs and will be conducted using pilotage and dead reckoning.","items":[["Preflight planning",["Aeronautical Information Manual","Sectional and Terminal area charts","Course selection","Procurement/analysis of weather reports and forecasts","Aircraft performance – best range airspeed, fuel endurance, ground speed","Cross-country flight log","Fuel requirements"]],["Cross-Country Flight",["Navigation","Estimating visibility in flight","Recognition and avoidance of hazardous terrain"]],["Airport Operations",["Navigation","Opening and closing flight plan","Airport traffic control procedures"]],["Emergency Procedures",["Complete or partial power loss – forced landing","System and equipment malfunctions – precautionary landing","Collision avoidance and wake turbulence precautions, wind shear avoidance"]]],"comp":["At the completion of this lesson, the student will be able to plan a VFR cross-country flight. He will be prepared for VFR navigation and have the knowledge to deal with some cross-country emergencies."],"study":""},"F31":{"obj":"This lesson will expand the student's understanding of cross-country operations and emergency procedures in preparation for his first solo cross-country flight. The flight will consist of three legs using pilotage, dead reckoning and radio navigation.","items":[["Preflight planning",["Weather briefing","Course selection","Cross-country flight log","VFR flight plan"]],["Cross-Country flight operations",["Opening and closing flight plan","Pilotage navigation – check points"]],["Air traffic control procedures",[]],["Emergency Procedures",["Complete or partial power loss","System and equipment malfunction Introduction"]],["Radio Navigation (VOR/GPS) and Radar Services",[]],["Adverse weather – estimating critical weather in flight",[]],["Diversion to alternate",["As a preventative measure","Airport selection","Estimating time enroute"]],["Lost procedures",["Heading selection","Altitude selection Introduction (cont'd)"]],["Lost procedures (cont'd)",["Obtaining assistance","Emergency landing"]],["Lost Communications",["Transponder operation","Airport operations – ATC light signals"]]],"comp":["This lesson will be complete when the student demonstrates the ability to perform a cross- country flight using pilotage, dead reckoning and radio navigation. Upon completion he should be ready for his first solo cross-country flight and will understand and be capable of executing the procedures used to divert to an alternate airport as appropriate to his first solo cross-country. He will also select the best course of action when given a lost situation."],"study":""},"F32":{"obj":"This lesson will familiarize the student with night cross-country procedures. The flight will be over 50 nm total distance and will emphasize pilotage in the night environment.","items":[["Preflight planning",["Weather briefing","Course selection","Altitude selection"]],["Cross-Country flight",["Pilotage","Radio navigation (VOR/GPS) Introduction"]],["Night flying considerations",["Chart interpretation","Minimum altitude","Cockpit lighting","Airport lighting"]],["Night emergency procedures",[]]],"comp":["Upon completion of this lesson, the student will show an increased understanding of preflight planning, especially with regard to night cross-country operations. The student should act promptly to simulated emergencies, exhibiting good judgment."],"study":""},"F33":{"obj":"This lesson will be the student's first solo cross-country flight. The instructor will select a relatively easy course and review all preflight planning and make appropriate endorsements.","items":[["Preflight planning – Checked by instructor",["Sectional charts","Altitude selection","Course selection","Checkpoint selection","Distance measurements","Computation of flight time, headings, and fuel requirements","Weather briefing","Aircraft performance","Navigation log","VFR flight plan","Weight and balance"]],["Cross-Country flight",["Departure","Establishing desired course","Opening flight plan/closing flight plan","Pilotage and dead reckoning","Proper radio communications"]],["Airport operations",[]],["Instructor limitations",[]]],"comp":["The student will conduct the assigned cross-country flight. The instructor will determine how well the flight was conducted by oral examination and will check to be sure all required flight log entries have been made."],"study":""},"F34":{"obj":"During this lesson the student will gain additional confidence and understanding of cross- country flight operations. This flight will consist of a longer course than the initial solo cross-country flight.","items":[["Preflight planning – Checked by instructor",["Sectional charts","Altitude selection","Course selection","Checkpoint selection","Distance measurements","Computation of flight time, headings, and fuel requirements","Weather briefing","Aircraft performance","Navigation log","VFR flight plan","Weight and balance"]],["Cross-country flight",["Departure","Establishing desired course","Opening flight plan/closing flight plan","Pilotage and dead reckoning","VOR/GPS navigation","Computing ground speed and ETA","Proper radio communications"]],["Airport operations",[]]],"comp":["The student will conduct the assigned cross-country flight. The instructor will determine how well the flight was conducted by oral examination and will check to be sure all required flight log entries have been made."],"study":""},"F35":{"obj":"This lesson will be a longer cross-country flight with landings at three different airports. The student will be able to demonstrate a complete understanding of cross-country procedures.","items":[["Preflight planning",["Weather","Course","Altitude","Weight and balance","VFR flight plan"]],["Cross-country flight",["Pilotage, dead reckoning, radio navigation (VOR/GPS)","Diversion to an alternate","Lost procedures","Emergency procedures Introduction"]],["Ground speed check – estimating time of arrival",[]]],"comp":["Upon completion of this lesson, the student will:","Demonstrate a thorough understanding of cross-country procedures;","Be able to verify the position of the helicopter with 3 nm at all times;","Arrive at checkpoints at ± 5 minutes of his estimate;","Maintain selected altitude ± 100 feet;","Maintain the desired airspeed ± 10 knots;","Maintain the desired heading ± 10 degrees; and,","During radio navigation, locate his position relative to the radio facility and track along a given radial or bearing."],"study":""},"F36":{"obj":"This solo cross-country flight will consist of at least 100 nm total distance with landings at a minimum of three airports, one unfamiliar to the student. One segment of the flight will be at least 25 nm straight line distance from takeoff to landing. If the student has not made any solo takeoffs, traffic patterns and landings at an airport with an operating control tower, such an airport should be selected for this flight and these three operations should be accomplished.","items":[["Preflight planning – Checked by instructor",["Sectional charts","Altitude selection","Course selection","Checkpoint selection","Distance measurements","Computation of flight time, headings, and fuel requirements","Weather briefing","Aircraft performance","Navigation log","VFR flight plan","Weight and balance"]],["Cross-country flight",["Departure","Establishing desired course","Opening flight plan/closing flight plan","Pilotage and dead reckoning","VOR/GPS navigation","Computing ground speed and ETA","Proper radio communications"]],["Airport operations",[]]],"comp":["The student will conduct the assigned cross-country flight. The instructor will determine how well the flight was conducted by oral examination and will check to be sure all required flight log entries have been made."],"study":""},"F37":{"obj":"During this lesson the student will review traffic pattern operations, advanced takeoff and landings, and emergency procedures in order to maintain proficiency.","items":[["Maximum performance takeoff and climb",[]],["Steep approach",[]],["Normal approach/takeoff",[]],["Shallow approach, running landing",[]],["Rapid deceleration – quick stops",[]],["Slope operations",[]],["Autorotative descents",[]],["Hovering autorotation",[]],["Partial power failure",[]],["Recovery from low rotor rpm",[]],["Systems and equipment malfunction",[]]],"comp":["At the completion of this lesson the student will have demonstrated increased proficiency in all advanced maneuvers."],"study":""},"F38":{"obj":"During this lesson the student will review basic flight maneuvers and emergency operations in preparation for the Stage 3 and final flight check.","items":[["Normal takeoff from a hover",[]],["Normal approach to a hover",[]],["Maximum performance takeoff and climb",[]],["Steep approach",[]],["Governor failure",[]],["Shallow approach/running landing",[]],["Rapid deceleration – quick stop",[]],["Slope operations",[]],["Autorotative descents with power recovery",[]],["Hovering autorotation",[]],["Settling with power",[]],["Systems and equipment malfunctions",[]],["Partial power failure",[]],["Recovery from low rotor rpm",[]],["Simulated engine failure – Forced landings",[]]],"comp":["During takeoff and climbs the student will demonstrate proper altitude and heading control, correcting for crosswind as appropriate.","During approaches, proper angle, rate of closure, and ground track will be demonstrated, correcting for crosswind as appropriate and terminating within 3 feet of designated point.","During running landings the student will make a smooth transition from descent to surface contact at or slightly above effective translational lift, using less than hovering power, and beyond but within 50 feet of designated point.","During simulated hazardous flight conditions the student will demonstrate immediate recognition and recovery.","During forced landings, the student will maintain rotor rpm within allowable limits immediately lowering the collective. He will establish an appropriate attitude maintaining airspeed as necessary. He will select a suitable landing area and maneuver so as to arrive at the selected area in trim, with acceptable rpm, airspeed and descent rate, and in position to make a safe autorotative landing."],"study":""},"F39":{"obj":"During this lesson the Stage 3 and Final Flight Check will be conducted by the Chief Flight Instructor or a designated instructor. He will evaluate the student's readiness for the Private Pilot – Helicopter flight test.","items":[["Oral examination",["R22/R44 Pilot's Operating Handbook","Weight and balance computation","Aircraft performance","Cross-country flight planning","Weather briefing","Federal Aviation Regulations – Parts 1, 61 and 91","Areas selected by the Chief Flight Instruc const TL_INSTR=()=>{const R=D.pilotRoles?D.pilotRoles():{"J. Nichols":{instructor:true},"M. Houston":{instructor:true}};return Object.keys(R).filter(n=>R[n].instructor)};
function seededBusy(d){ // sample bookings for days the owner demo doesn't cover
  if(d.getDay()===0)return [];
  const k=d.getDate(),out=[],pick=(i)=>(k+i)%3!==0;
  [[8,10,"J. Nichols"],[10.5,12.5,"M. Houston"],[13,15,"J. Nichols"],[15.5,17.5,"M. Houston"]].forEach(([s,e,w],i)=>{if(pick(i))out.push({ac:"N7187K",who:w,s,e,kind:"busy"})});
  if(d.getDay()===5||d.getDay()===6)out.push({ac:"N931QA",who:"R. Ellis",s:10,e:15,kind:"busy"});
  else if(pick(5))out.push({ac:"N931QA",who:"J. Nichols",s:13,e:15,kind:"busy"});
  if(pick(6))out.push({ac:null,who:"M. Houston",s:8,e:9,kind:"busy"});
  return out;
}
function schedDay(d){
  let L=[];
  if(sameDay(d,today)){
    (D.dayBook?D.dayBook():[]).filter(b=>b.st!=="cancelled").forEach(b=>{const [who,code]=(b.t||"").split(" · ");const me=who===ME_NAME;
      L.push({ac:b.ac,who:b.who,s:b.s,e:b.e,kind:me?"me":b.type==="mx"?"mx":"busy",code:me?(code||"").split(" ")[0]:null,ground:b.type==="ground"})});
  }else L=seededBusy(d);
  const have=new Set(L.filter(x=>x.code).map(x=>x.code));
  state.upcoming.filter(u=>sameDay(u.date,d)&&!have.has(u.code)).forEach(u=>L.push({ac:u.ac.tail,who:u.instr.split(",")[0],s:u.start,e:u.start+2,kind:"me",code:u.code}));
  state.ground.filter(g=>sameDay(g.date,d)&&!have.has(g.code)).forEach(g=>L.push({ac:null,who:g.instr.split(",")[0],s:g.start,e:g.start+g.dur,kind:"me",code:g.code,ground:true}));
  // drop sample bookings that collide with your own
  const mine=L.filter(x=>x.kind==="me");
  return L.filter(x=>x.kind==="me"||!mine.some(m=>m.s<x.e&&x.s<m.e&&((m.ac&&m.ac===x.ac)||m.who===x.who)));
}
function schedFree(d,s,e,ac,who){return !schedDay(d).some(x=>x.s<e&&s<x.e&&((ac&&x.ac===ac)||(who&&x.who===who)))}
function viewSchedule(){
  const d=state.schedDay||today,L=schedDay(d),pct=h=>h/24*100;
  const rows=[{k:"ac",id:"N7187K",l:"N7187K",sub:"R22 · training"},{k:"ac",id:"N931QA",l:"N931QA",sub:"R44"},...TL_INSTR().map(n=>({k:"p",id:n,l:n,sub:"Instructor"}))];
  const lane=r=>L.filter(x=>r.k==="ac"?x.ac===r.id:x.who===r.id).map(x=>{const me=x.kind==="me",lbl=me?"You · "+(x.code||"Lesson"):x.kind==="mx"?"Maintenance":"Booked";
    return `<${me?"button":"div"} class="sblk ${x.kind}" style="left:${pct(x.s)}%;width:${(x.e-x.s)/24*100}%" ${me?'data-act="mine"':""} title="${lbl} · ${fmtTime(x.s)}–${fmtTime(x.e)}"><b>${esc(lbl)}</b><span>${fmtTime(x.s)}${me&&r.k==="ac"?" · "+esc(x.who):me&&r.k==="p"?(x.ac?" · "+x.ac:" · Classroom"):""}</span></${me?"button":"div"}>`}).join("");
  const days=[...Array(7)].map((_,i)=>addDays(today,i));
  const hrs=[...Array(24)].map((_,h)=>`<span style="left:${pct(h)}%">${h%12||12}${h<12?"a":"p"}</span>`).join("");
  const now=sameDay(d,today)?`<div class="snow" style="left:${pct(DEMO_NOW)}%"></div>`:"";
  const rowHtml=r=>`<div class="stl-row"><div class="stl-lbl"><b class="${r.k==="ac"?"mono":""}">${r.l}</b><span>${r.sub}</span></div><div class="slane ${r.id==="N931QA"?"":"book"}" data-slane="${r.k}" data-sid="${r.id}">${lane(r)}${now}</div></div>`;
  return `
    <div><p class="sub">The whole day for the aircraft and instructors. Other people's bookings show as Booked. Tap an open spot on the R22 or an instructor to book a lesson there.</p></div>
    <div class="sdays" role="group" aria-label="Pick a day">${days.map(x=>`<button data-sday="${x.toISOString()}" aria-pressed="${sameDay(x,d)}">${sameDay(x,today)?"Today":DOW[x.getDay()]}<b>${x.getDate()}</b></button>`).join("")}</div>
    <div class="stl-bar"><div class="stl-legend"><span><i class="legend-me"></i>Your lessons</span><span><i class="legend-busy"></i>Booked</span><span><i class="legend-mx"></i>Maintenance</span></div>
</div>
    <div class="stl-card"><div class="stl-wrap"><div class="stl">
      <div class="stl-head"><div></div><div class="stl-hrs">${hrs}</div></div>
      <div class="stl-grp">Aircraft</div>${rows.filter(r=>r.k==="ac").map(rowHtml).join("")}
      <div class="stl-grp">Instructors</div>${rows.filter(r=>r.k==="p").map(rowHtml).join("")}
    </div></div></div>
    <p class="note">Lessons book as a 2-hour block in the R22 with brief and debrief. Free cancellation up to 24 hours before.</p>`;
}
function viewBook(){

  }
  const slots=slotsFor(state.bookDay), nf=nextFlightCode();

    <div><p class="sub">Open 2-hour times when ${INSTRUCTOR.split(",")[0]} and a training aircraft are both free.</p></div>

    <div class="days" role="group" aria-label="Pick a day">${days.map(d=>`<button class="day-btn" data-day="${d.toISOString()}" aria-pressed="${sameDay(d,state.bookDay)}"><div class="dow">${DOW[d.getDay()]}</div><div class="dn">${d.getDate()}</div></button>`).join("")}</div>
    <h2>${fmtDate(state.bookDay)} · 2-hour block</h2>
    ${slots.length?`<div class="slots">${slots.map(h=>`<button class="slot" data-slot="${h}">${fmtTime(h)}</button>`).join("")}</div>`:`<div class="empty">No open times this day. Try another day.</div>`}

function lessonDetail(i){
  const d=LDET[i[0]];if(!d)return "";
  const time=i[0][0]==="G"?`${i[4].toFixed(1)} hr ground training`:[i[2]?i[2].toFixed(1)+" hr dual":"",i[3]?i[3].toFixed(1)+" hr solo":"",i[6]?i[6].toFixed(1)+" hr pre/post-flight discussion":""].filter(Boolean).join(" · ");
  const past=state.past.find(p=>p.lesson===lessonName(i[0]));
  return `<div class="ldet">
    <div class="ld-time">${time}</div>
    <h3>Objective</h3><p>${esc(d.obj)}</p>
    ${d.items.length?`<h3>What's covered</h3><ol class="ld-items">${d.items.map(([t,sub])=>`<li><b>${esc(t)}</b>${sub.length?`<span>${sub.map(esc).join(" · ")}</span>`:""}</li>`).join("")}</ol>`:""}
    <h3>Completion standards</h3>${d.comp.length>1?`<ol class="ld-comp">${d.comp.map(c=>`<li>${esc(c)}</li>`).join("")}</ol>`:`<p>${esc(d.comp[0])}</p>`}
    ${d.study?`<h3>Study assignment</h3><p>${esc(d.study)}</p>`:""}
    ${past?`<h3>Instructor notes</h3><p class="ld-notes">${esc(past.notes)}</p>`:""}
  </div>`;
}
function viewSyllabus(){
  const dF=[...state.done].filter(c=>c[0]==="F").length, dG=[...state.done].filter(c=>c[0]==="G").length;
  const nf=nextFlightCode(), og=openGround().slice(0,3);
  const st=c=>{
    if(state.done.has(c))return `<span class="st done">Done</span>`;
    const u=state.upcoming.find(x=>x.code===c);if(u)return `<span class="st sched">${fmtDate(u.date).replace(/^\w+, /,"")}</span>`;
    const g=state.ground.find(x=>x.code===c);if(g)return `<span class="st sched">${fmtDate(g.date).replace(/^\w+, /,"")}</span>`;
    if(c===nf)return `<button class="btn small primary" data-bookf="1">Book</button>`;
    if(og.includes(c))return `<button class="btn small ghost" data-bookg="${c}">Book</button>`;

  };

    <section class="card prog">
      <div><b>Private Pilot – Helicopter</b><div class="li-meta">Part 61 · Robinson Flight Training Guide (R22/R44) · Enrolled Sep 2026</div></div>

    <details class="stage" data-stage="${esc(stg.name)}" ${state.openStages.has(stg.name)?"open":""}>
      <summary><span>${esc(stg.name)}</span><span class="mono li-meta">${done}/${stg.items.length}</span></summary>
      <div class="syl">${stg.items.map(i=>{const open=state.openLesson===i[0];return `<div class="syl-w ${open?"open":""}"><div class="syl-i ${state.done.has(i[0])?"is-done":""}" data-lx="${i[0]}" role="button" tabindex="0" aria-expanded="${open}">
        <span class="code ${i[0][0]==="G"?"g":"f"}">${i[0]}</span>
        <span class="syl-t">${esc(i[1])}<span class="li-meta">${i[0][0]==="G"?i[4].toFixed(1)+" hr ground":(i[2]?i[2].toFixed(1)+" dual":"")+(i[2]&&i[3]?" + ":"")+(i[3]?i[3].toFixed(1)+" solo":"")}${i[5]?" · "+esc(i[5]):""}</span></span>

    </details>`}).join("")}
    <p class="note">Lesson details are from the Robinson R22/R44 Flight Training Guide (Jun 2016). Your instructor may adjust lesson times to fit your progress.</p>`;
}

function rangeAt(poly,v,axis){const o=1-axis,h=[];for(let i=0;i<poly.length;i++){const p=poly[i],q=poly[(i+1)%poly.length];
  if(p[axis]===q[axis]){if(Math.abs(p[axis]-v)<1e-9)h.push(p[o],q[o]);continue}
  if((p[axis]-v)*(q[axis]-v)<=0)h.push(p[o]+(v-p[axis])*(q[o]-p[o])/(q[axis]-p[axis]))}
  return h.length?[Math.min(...h),Math.max(...h)]:null}
const inRange=(r,v)=>r&&v>=r[0]-1e-6&&v<=r[1]+1e-6;
const latStr=v=>Math.abs(v)<0.005?"0.00":Math.abs(v).toFixed(2)+(v>0?" R":" L");
function wbCalc(){
  const w=state.wb, a=curAc(), m=curModel(), FL=6;
  const mainG=Math.min(Math.max(w.fuel,0),m.main.usable), auxG=auxFromMain(m,mainG);
  const rows=[["Basic empty weight",a.bew,a.arm,a.lat],[m.stu.label,w.stu,m.stu.arm,m.stu.lat],[m.ins.label,w.ins,m.ins.arm,m.ins.lat]];
  const fuelRows=[["Main fuel ("+mainG.toFixed(1)+" gal)",mainG*FL,m.main.arm,m.main.lat],["Aux fuel ("+auxG.toFixed(1)+" gal)",auxG*FL,m.aux.arm,m.aux.lat]];
  const sum=r=>{const wt=r.reduce((t,x)=>t+x[1],0),lm=r.reduce((t,x)=>t+x[1]*x[2],0),tm=r.reduce((t,x)=>t+x[1]*x[3],0);return{wt,lm,tm,long:lm/wt,lat:tm/wt}};
  const zf=sum(rows), to=sum(rows.concat(fuelRows));
  const checks=[], chk=(ok,t)=>checks.push({ok,t});
  chk(to.wt<=m.maxGross+1e-9,`Takeoff weight ${to.wt.toFixed(1)} lb, max ${m.maxGross} lb`);
  chk(zf.wt>=m.minGross-1e-9,`Zero-fuel weight ${zf.wt.toFixed(1)} lb, min ${m.minGross} lb`);
  [[to,"Takeoff"],[zf,"Zero-fuel"]].forEach(([p,nm])=>{
    const r=rangeAt(m.envLong,p.wt,1); chk(inRange(r,p.long),r?`${nm} long. CG ${p.long.toFixed(2)} in, limits ${r[0].toFixed(2)}–${r[1].toFixed(2)} in`:`${nm} weight is outside the envelope`);
    const rl=rangeAt(m.envLat,p.long,0); chk(inRange(rl,p.lat),rl?`${nm} lat. CG ${latStr(p.lat)}, limits ${latStr(rl[0])} to ${latStr(rl[1])}`:`${nm} lat. CG can't be checked: long. CG outside limits`);
  });
  const seatBad=w.stu>m.seatMax||w.ins>m.seatMax;
  if(seatBad)chk(false,`Max ${m.seatMax} lb per seat`);
  const ok=checks.every(c=>c.ok);
  const st=!ok?"bad":m.maxGross-to.wt<30?"warn":"ok";
  return{rows,fuelRows,zf,to,checks,seatBad,st,mainG,auxG,max:m.maxGross};
}
function wbHtml(){

  return `<div class="wb ${c.st}"><div><span class="mono" style="font-size:18px">${c.to.wt.toFixed(0)}</span> <span class="note">of ${c.max.toLocaleString()} lb</span></div><span class="pill ${c.st}">${c.st==="bad"?"Out of limits":c.st==="warn"?"Near limit":"In limits"}</span>
    <div class="note" style="grid-column:1/-1">${esc(msg)} · CG <span class="mono">${c.to.long.toFixed(2)}</span> in / <span class="mono">${latStr(c.to.lat)}</span></div></div>`;

function envChart(kind,c,compact){
  const m=curModel(), env=kind==="long"?m.envLong:m.envLat;
  const [x0,x1,xs]=m.axes.x, [y0,y1,ys]=kind==="long"?m.axes.y:m.axes.lat;
  const W=340,H=compact?210:250,L=50,Rr=12,T=16,B=36;
  const sx=x=>L+(x-x0)/(x1-x0)*(W-L-Rr), sy=y=>T+(y1-y)/(y1-y0)*(H-T-B);
  const cl=(v,a,b)=>Math.min(Math.max(v,a),b);
  const yk=kind==="long"?"wt":"lat";
  const P=p=>[sx(cl(p.long,x0,x1)),sy(cl(p[yk],y0,y1))];
  const okP=p=>kind==="long"?inRange(rangeAt(m.envLong,p.wt,1),p.long):inRange(rangeAt(m.envLat,p.long,0),p.lat);
  const pTo=P(c.to), pZf=P(c.zf);
  const xt=[],yt=[];for(let v=x0;v<=x1+1e-9;v+=xs)xt.push(v);for(let v=y0;v<=y1+1e-9;v+=ys)yt.push(v);
  const yl=v=>kind==="long"?v.toLocaleString():v===0?"0":Math.abs(v)+(v>0?"R":"L");
  return `<svg viewBox="0 0 ${W} ${H}" class="env" role="img" aria-label="${kind==="long"?"Gross weight versus longitudinal CG":"Lateral CG versus longitudinal CG"}">
    ${yt.map(y=>`<line x1="${L}" x2="${W-Rr}" y1="${sy(y)}" y2="${sy(y)}" class="grid"/><text x="${L-6}" y="${sy(y)+4}" text-anchor="end" class="tick">${yl(y)}</text>`).join("")}
    ${xt.map((x,i)=>`<line x1="${sx(x)}" x2="${sx(x)}" y1="${T}" y2="${H-B}" class="grid"/>${i%2===0?`<text x="${sx(x)}" y="${H-B+15}" text-anchor="middle" class="tick">${x}</text>`:""}`).join("")}
    ${kind==="long"?`<line x1="${L}" x2="${W-Rr}" y1="${sy(m.maxGross)}" y2="${sy(m.maxGross)}" class="maxg"/>`:`<line x1="${L}" x2="${W-Rr}" y1="${sy(0)}" y2="${sy(0)}" class="zero"/>`}
    <polygon points="${env.map(([x,y])=>sx(x)+","+sy(y)).join(" ")}" class="envp"/>
    <line x1="${pTo[0]}" y1="${pTo[1]}" x2="${pZf[0]}" y2="${pZf[1]}" class="path"/>
    <circle cx="${pZf[0]}" cy="${pZf[1]}" r="5.5" class="ld ${okP(c.zf)?"":"bad"}"/>
    <circle cx="${pTo[0]}" cy="${pTo[1]}" r="6.5" class="to ${okP(c.to)?"":"bad"}"/>
    <text x="${pTo[0]+9}" y="${pTo[1]-8}" class="ptl">TO</text><text x="${pZf[0]+9}" y="${pZf[1]+14}" class="ptl">ZF</text>
    <text x="${W-Rr}" y="${H-3}" text-anchor="end" class="axl">Longitudinal CG (in from datum)</text>
    <text x="${L}" y="${T-5}" class="axl">${kind==="long"?"Gross weight (lb)":"Lateral CG (in)"}</text>
  </svg>`;
}
function wbTable(c){
  const tr=(r,cls="")=>`<tr class="${cls}"><td>${esc(r[0])}</td><td class="mono">${r[1].toFixed(1)}</td><td class="mono">${r[2].toFixed(2)}</td><td class="mono">${r[3].toFixed(2)}</td></tr>`;
  const tot=(l,p)=>tr([l,p.wt,p.long,p.lat],"tot");
  return `<div class="tbl"><table class="bill wbt">
    <tr><th>Item</th><th>Wt lb</th><th>Long arm</th><th>Lat arm</th></tr>
    ${c.rows.map(r=>tr(r)).join("")}${tot("Zero usable fuel",c.zf)}${c.fuelRows.map(r=>tr(r)).join("")}${tot("Takeoff",c.to)}
  </table></div>`;
}

    if(s.resched){const u=state.upcoming.find(x=>x.id===s.resched);u.date=s.date;u.start=s.start;u.mxOk=false;u.mxAt=null;u.recurring=false;state.resched=null}
    else{const c=nextFlightCode()||"F30",ins=s.instr?s.instr+", CFI-H":INSTRUCTOR;state.upcoming.push({id:++lessonId,code:c,date:s.date,start:s.start,ac:R22,lesson:lessonName(c),obj:"Objective and completion standards for "+c+" are in the Robinson Flight Training Guide.",mxOk:false,instr:ins});
      if(sameDay(s.date,today))D.push("newBookings",{id:"s"+Date.now(),ac:"N7187K",who:ins.split(",")[0],s:s.start,e:s.start+2,type:"dual",t:ME_NAME+" · "+c,st:"up",amt:0})}
    state.upcoming.sort((a,b)=>a.date-b.date||a.start-b.start);
    state.sheet=null;if(!s.fromSched)state.tab="lessons";render();toast(s.resched?"Lesson moved · calendar updated":"Lesson booked · added to "+state.calendar)}
  else if(act==="cancel"){state.cancelling=id;render()}
  else if(act==="keep"){state.cancelling=null;render()}
  else if(act==="docancel"){state.upcoming=state.upcoming.filter(u=>u.id!==id);state.cancelling=null;render();toast("Lesson cancelled · removed from your calendar")}
  else if(act==="resched"){state.resched=id;state.tab="book";render()}
});
document.getElementById("app").addEventListener("keydown",e=>{const t=e.target.closest&&e.target.closest("[data-lx]");if(t&&(e.key==="Enter"||e.key===" ")&&e.target===t){e.preventDefault();t.click()}});
document.getElementById("app").addEventListener("toggle",e=>{const d=e.target;if(d.dataset&&d.dataset.stage){d.open?state.openStages.add(d.dataset.stage):state.openStages.delete(d.dataset.stage)}},true);
document.getElementById("app").addEventListener("input",e=>{
  if(["wbStudent","wbInstr"].includes(e.target.id)){
    state.wb.stu=num("wbStudent")||0;state.wb.ins=num("wbInstr")||0;
    const o=document.getElementById("wbOut");
    if(o)o.innerHTML=wbHtml();
  }
  if(e.target.id==="hobbsIn"||e.target.id==="tachIn"){const f=state.flight,k=e.target.id==="hobbsIn"?"hobbs":"tach",out=f[k+"Out"],v=parseFloat(e.target.value),d=document.getElementById(k+"Diff");
    if(d){if(isNaN(v)){d.innerHTML="&nbsp;";d.className="tdiff"}else{const df=v-out;d.textContent=df>0?"+"+df.toFixed(1)+" hr":"Must be above "+out.toFixed(1);d.className="tdiff"+(df>0?"":" bad")}}}
  if(e.target.id==="fuelR"){state.wb.fuel=mainForTotal(curModel(),+e.target.value);updateFuel()}
});
document.getElementById("app").addEventListener("change",e=>{if(e.target.id==="wxOk")state.wx=e.target.checked;
  if(e.target.id==="docCam"||e.target.id==="docFile"){takeFile(e.target.files&&e.target.files[0]);return}
  if(e.target.id==="medExp"&&state.sheet)state.sheet.exp=e.target.value;
  if(e.target.id==="medCls"&&state.sheet)state.sheet.cls=e.target.value;
  if(e.target.id==="rateIn"&&state.flight&&state.flight.by==="instructor"){const v=parseFloat(e.target.value);state.flight.rate=isNaN(v)||v<0?INSTR_RATE:Math.round(v*100)/100;state.sheet.charges=calcCharges(state.flight);render()}});
(function syncFromDemo(){
  const dd=D.get("docs",{}),spc=DOCS.find(x=>x.id==="spc");
  if(dd.spc){spc.status=dd.spc;if(dd.spc!=="need"){spc.file=spc.file||"student-pilot-certificate.jpg";spc.when=spc.when||MON[today.getMonth()]+" "+today.getDate()}}
  const bal=D.get("alexBal",null);if(bal!=null)state.balance=bal;
  D.get("groundDone",[]).forEach(c=>{state.ground=state.ground.filter(g=>g.code!==c);state.done.add(c)});
  D.get("lessons",[]).forEach(l=>{const i=state.upcoming.findIndex(u=>u.code===l.code);if(i<0)return;const n=state.upcoming.splice(i,1)[0];
    state.done.add(l.code);state.hours=Math.round((state.hours+l.fl)*10)/10;state.lessonsDone++;
    state.past.unshift({date:today,start:n.start,ac:n.ac,lesson:n.lesson,hrs:l.fl,notes:"Instructor notes pending."});
    if(l.hobbsIn){state.hobbs=l.hobbsIn;state.tach=l.tachIn}state.lastIn[n.ac.tail]={at:new Date(),by:"J. Snuffy"};state.lessonDay=false});
})();
render();
})();
</script></body></html>
